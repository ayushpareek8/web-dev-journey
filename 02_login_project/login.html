<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        /* following 3 properties will center content and make the display flex */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #525151;
        border-radius: 10px;
        padding: 30px;
        width: 300px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 6px;
        background-color: white;
        border: none;
      }
      h2 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
      }
      button {
        background-color: rgb(67, 67, 236);
        color: white;
        padding: 10px;
        border-radius: 10px;
      }
      button:hover {
        background-color: rgb(17, 17, 234);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form action="">
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
