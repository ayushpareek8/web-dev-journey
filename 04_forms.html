<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>login form.</h1>
    <form action="">
        <label for="email">email: <input type="text" name="email"></label>
        <label for="password">password: <input type="password" placeholder="enter your password" name="password"></label>
        <button type="submit">login</button>
    </form>
    <div>
        <h2>learning form.</h2>
        <form action="">
            <label for="email">
                email: 
                <input type="email" name="email" id="">

            </label>
            <label for="month">month: <input type="month" name="month" id=""></label>
            <button type="submit">submit.</button>
        </form>
        <!-- text area can also be used in place of input with its attributes  -->
        <!-- fancy  input types- checkbox,radio,color,month  -->
         <!-- select input is also used in place of input , it needs to have some options with values , it gives a dropdown on the form. -->
        <!-- placeholder is an attribute that works on all inputs and places a text in the input box that goes away as you write . -->
    </div>
</body>
</html>
