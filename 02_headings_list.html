<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
    <h1>Lorem, ipsum dolor.</h1>
    <h2>Lorem ipsum dolor <em>sit amet</em> consectetur.</h2>
    <p>Lorem ipsum dolor <strong>sit amet</strong> consectetur.</p>
    <ol>
        <li>orange tea</li>
        <li>black tea</li>
        <li>chai tea</li>
    </ol>
    <!--img tag is also an inline element , we can check for all the tags by inspecting block diagram on chrome.-->
    <img src="./images/ap.jpg" width="200px" height="400px" alt="">
    <div>
        <h1>block level element</h1>
        <ul>
            <li>headings h1 to h6 </li>
            <li>ol ,li</li>
            <li>p</li>
        </ul>
    </div>
    <div>
        <h1>Inline elements.</h1>
        <ul>
            <li>a tags</li>
            <li>img</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>

</body>
</html>
